# Installed from desktop-config/system/ (bead dc-ouv5). Captures evidence when
# the X server stops, after X died at resume on 2026-10-14 with no trace.
[X11]
# -core makes a fatal X error abort, so systemd-coredump keeps a backtrace.
ServerArguments=-nolisten tcp -core
DisplayStopCommand=/usr/local/libexec/x-diag-stop
