# The keys set here are listed for bin/bindings-help in
# .config/bindings-help.d/neru.tsv.  Update that file whenever a binding
# or behaviour set here changes, so the help stays accurate.

# Neru takes over warpd's jump-to-a-point modes; fievel handles free
# mousing (d+f or F3).  Only settings that differ from Neru's defaults
# are set here.
#
# .fluxbox/keys.erb runs `neru grid` and `neru hints` with --action
# move_mouse, so picking a target moves the pointer and closes the mode.
# Neru's X11 hotkey backend cannot grab symbol keys such as ; and -, though
# its docs list them.

[hotkeys]
# fievel holds F19 while E+R is held.  Tap u/i/j/k to drill into quadrants;
# releasing the chord moves the pointer to the chosen cell and closes the
# grid.  --hold comes from the local feat/mode-hold branch, proposed
# upstream; a Neru build without it rejects this file.
"F19" = "recursive_grid --hold --action move_mouse"

[grid]
# warpd's hint_chars, so labels read the same as before.
characters = "abcdefghijklmnoprstuvwxyz"
# Two-letter labels like warpd's; Neru enlarges the cells to still cover
# the screen.
max_label_length = 2

[grid.ui]
# The default 10pt is unreadably small here; labels still shrink to fit
# their cells.
font_size = 24

# Shift+N/Shift+P jump to the next/previous monitor; the overlay follows.
[grid.hotkeys]
"Shift+N" = "action move_monitor"
"Shift+P" = "action move_monitor --previous"

[recursive_grid]
# Quadrants on the right hand while the left holds E+R.
grid_cols = 2
grid_rows = 2
keys = "uijk"

[recursive_grid.ui]
font_size = 24

[hints]
# OCR ("vision") took ~9s on a full-width window and the accessibility
# tree finds nothing in terminals; segment takes ~0.2s.
strategy = "segment"
# The default asdfghjkl gives three-letter labels; warpd's 25 letters
# give two-letter labels for up to 625 targets.
hint_characters = "abcdefghijklmnoprstuvwxyz"

[hints.segment]
# One hint per run of same-coloured words, not per word, to stay under
# the label limit on text-heavy windows.
targets = "phrases"

[hints.hotkeys]
"Shift+N" = "action move_monitor"
"Shift+P" = "action move_monitor --previous"
