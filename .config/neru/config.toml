# Neru takes over warpd's jump-to-a-point modes; fievel handles free
# mousing (d+f or F3).  Only settings that differ from Neru's defaults
# are set here.
#
# No [hotkeys]: .fluxbox/keys.erb runs `neru grid` and `neru hints` on
# the keys warpd used.  Neru's X11 hotkey backend cannot
# grab symbol keys such as ; and -, though its docs list them.

[grid]
# warpd's hint_chars, so labels read the same as before.
characters = "abcdefghijklmnoprstuvwxyz"
# Two-letter labels like warpd's; Neru enlarges the cells to still cover
# the screen.  The cursor jumps after the label, so the sub-cell key is
# optional.
max_label_length = 2

# Shift+N/Shift+P jump to the next/previous monitor; the overlay follows.
[grid.hotkeys]
"Shift+N" = "action move_monitor"
"Shift+P" = "action move_monitor --previous"

[hints]
# The accessibility tree finds nothing in terminals and needs flags in
# Chromium.  OCR finds few enough targets for two-letter labels; the
# image-based contour and segment strategies found over 700 here.
strategy = "vision"

[hints.hotkeys]
"Shift+N" = "action move_monitor"
"Shift+P" = "action move_monitor --previous"
