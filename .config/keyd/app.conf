# Emacs does not consume XCompose sequences, so emit its built-in
# currency input commands instead. Device-specific aliases avoid changing
# ordinary 3 and minus keys on keyboards where they are not currency keys.
[emacs]

shift.sterling_shifted = macro(C-x 8 L)
control+shift.sterling_shifted = macro(C-x 8 E)
main.sterling_plain = macro(C-x 8 L)
shift.sterling_plain = macro(C-x 8 E)
