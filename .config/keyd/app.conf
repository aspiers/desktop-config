# Emacs does not consume XCompose sequences, so emit its built-in
# currency input commands instead. Device-specific aliases avoid changing
# ordinary 3 and minus keys on keyboards where they are not currency keys.
[emacs]

shift.sterling_shifted = macro(C-x 8 L)
control+shift.sterling_shifted = macro(C-x 8 E)
main.sterling_plain = macro(C-x 8 L)
shift.sterling_plain = macro(C-x 8 E)

# Orca (the agent IDE) ignores plugin keybindings while a terminal has
# focus (stablyai/orca#15642) and its own keybindings cannot run shell
# commands, so the attention-cycling helper is bound here, scoped to
# Orca's window. keyd runs command() as root with stdio on /dev/null,
# hence runuser. Meta on this setup is keyd's alt layer.
[orca-ide]

alt+shift.up = command(/usr/sbin/runuser -u adam -- /home/adam/bin/orca-cycle-attention-agent previous)
alt+shift.down = command(/usr/sbin/runuser -u adam -- /home/adam/bin/orca-cycle-attention-agent next)
