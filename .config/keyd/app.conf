# Emacs does not consume XCompose sequences, so emit its built-in
# currency input commands instead. Device-specific aliases avoid changing
# ordinary 3 and minus keys on keyboards where they are not currency keys.
[emacs]

shift.sterling_shifted = macro(C-x 8 L)
control+shift.sterling_shifted = macro(C-x 8 E)
main.sterling_plain = macro(C-x 8 L)
shift.sterling_plain = macro(C-x 8 E)

# Orca (the agent IDE) ignores plugin keybindings while a terminal has
# focus (stablyai/orca#15642) and its own keybindings cannot run shell
# commands, so the attention-cycling helper is bound here, scoped to
# Orca's window. keyd runs command() as root with stdio on /dev/null,
# hence runuser. Meta on this setup is keyd's alt layer. The mapper
# classifies by the focused child window, whose WM_CLASS is "orca", not
# the top-level window's "orca-ide" (check with keyd-application-mapper -v).
[orca]

# Each run appends its outcome to the log, since keyd discards stdio.
alt+shift.up = command(/usr/sbin/runuser -u adam -- /home/adam/bin/orca-cycle-attention-agent previous --log /home/adam/.local/state/keyd/orca-attention.log)
alt+shift.down = command(/usr/sbin/runuser -u adam -- /home/adam/bin/orca-cycle-attention-agent next --log /home/adam/.local/state/keyd/orca-attention.log)

# extrakto-style token picker (C-M-o, as in tmux and Herdr). It pops up a
# rofi window, but runuser passes no X session environment and the session
# cookie path changes per login, so borrow DISPLAY and XAUTHORITY from the
# saved session file.
control+alt.o = command(/usr/sbin/runuser -u adam -- /home/adam/bin/run-with-local-X-display /home/adam/bin/orca-extract --focused --log /home/adam/.local/state/keyd/orca-extract.log)
