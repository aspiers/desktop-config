[ids]
# Modern carbon grey Kinesis Advantage2 with USB connector
29ea:0102
# Same keyboard while its v-drive is open (Progm+F1)
29ea:0103

[aliases]
backslash = sterling_plain

[main]
# OS-independent remaps live in the keyboard's firmware, backed up in
# .keymaps/kinesis-advantage2/active/qwerty.txt: Caps Lock sends minus,
# Up and Down are swapped, End sends Esc, the left thumb Delete and Alt
# keys are swapped, the top right key sends backslash, the key below it
# sends non-US \ (102nd), and the International key sends Insert. Only
# Linux-specific remaps belong here.

# Left thumb pad, without the Delete/Alt swap and End = Esc of
# kinesis-left-thumb-pad, which the firmware now does
home = layer(altgr)

# Under the us X layout 102nd types < and >, so turn it back into \
# The Insert key (the International key) sends Insert from firmware.
102nd = backslash

include partials/kinesis-right-thumb-pad
# The top right key types £ and €
include partials/backslash-currency
include partials/gb
include partials/alt-shift-layer
include partials/control-alt-layer

[meta]
home = home
# Physical End key, which the firmware sends as Esc
esc = end
