[ids]
# Modern carbon grey Kinesis Advantage2 with USB connector
29ea:0102
# Same keyboard while its v-drive is open (Progm+F1)
29ea:0103

[aliases]
minus = sterling_plain

[main]
# Assumes the firmware's default key codes, which is what it sent on
# 2026-11-14 after its v-drive was closed.
include partials/kinesis-left-thumb-pad
include partials/kinesis-right-thumb-pad
capslock = minus
102nd = insert
up = down
down = up
include partials/minus-sterling-euro
include partials/gb
include partials/alt-shift-layer
include partials/control-alt-layer
