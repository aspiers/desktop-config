[ids]
# Modern carbon grey Kinesis Advantage2 with USB connector
29ea:0102
# Same keyboard while its v-drive is open (Progm+F1)
29ea:0103

[aliases]
backslash = sterling_plain

[main]
# Firmware remaps (v-drive active/qwerty.txt) now do what keyd used to:
# Caps Lock sends minus, Up and Down are swapped, the top right key
# sends backslash and the key below it sends non-US \ (102nd), as on the
# Advantage 360. The left thumb pad Delete key sends Alt; the Alt key
# must send Delete from firmware too, since keyd cannot tell two keys
# sending the same code apart.

# Left thumb pad, without the Delete/Alt swap of kinesis-left-thumb-pad
home = layer(altgr)
end = esc

# Under the us X layout 102nd types < and >, so turn it back into \
# FIXME: the Insert key used to send 102nd too (102nd = insert); check
# what it sends now.
102nd = backslash

include partials/kinesis-right-thumb-pad
# The top right key types £ and €
include partials/backslash-currency
include partials/gb
include partials/alt-shift-layer
include partials/control-alt-layer

[meta]
home = home
end = end
