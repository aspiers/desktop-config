# Kinesis Advantage 360 configuration
[ids]
1d50:615e
29ea:0362

[aliases]
backslash = sterling_plain

[main]

# Most thumb pad remapping is done in the 360's firmware, so this
# doesn't use the kinesis-*-thumb-pad partials: Delete/Alt are swapped,
# End emits esc, and the right Win/Ctrl are swapped.
home = layer(altgr)

# Physical Win key on the right thumb pad, which the firmware now
# sends as right Alt
rightalt = compose

capslock = insert

# Note: up/down swap and esc emitting minus are handled in firmware.
# So is the \ / £ swap that UK Windows needs: the top right key sends
# backslash, which Windows UK reads as # and ~, and the key below it
# sends non-US \ (102nd), which Windows UK reads as \ and |.

# Under the us X layout 102nd types < and >, so turn it back into \
102nd = backslash

# The top right key types £ and €
include partials/backslash-currency
include partials/gb

[meta]
home = home
# Physical End key, which emits esc
esc = end

[main]

include partials/alt-shift-layer
include partials/control-alt-layer
