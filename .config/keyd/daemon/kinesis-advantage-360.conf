# Kinesis Advantage 360 configuration
[ids]
1d50:615e
29ea:0362

[aliases]
backslash = sterling_plain

[main]

# Most thumb pad remapping is done in the 360's firmware, so this
# doesn't use the kinesis-*-thumb-pad partials: Delete/Alt are swapped,
# End emits esc, and the right Win/Ctrl are swapped.
home = layer(altgr)

# Physical Win key on the right thumb pad
rightcontrol = compose

capslock = insert

# Note: up/down swap, esc emitting minus and the top right key
# emitting non-US # (which Linux reports as backslash) are handled in
# firmware

# The top right key types £ and €
include partials/backslash-currency
include partials/gb

[shift]
# The XKB layout is gb, where backslash types #
3 = backslash

[meta]
home = home
# Physical End key, which emits esc
esc = end

[main]

include partials/alt-shift-layer
include partials/control-alt-layer
