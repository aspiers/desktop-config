[extend]
useDefault = true

[[allowlists]]
description = "Git-ignored local runtime data"
paths = [
  '''^\.config/chrysalis/''',
  '''^\.refact/''',
  '''^tmp/''',
]

[[allowlists]]
description = "Monitor audit trace fixtures contain deterministic state hashes"
paths = [
  '''^\.local/lib/monitor-controller/tests/monitor_controller/fixtures/traces/[^/]+\.audit\.jsonl$''',
]
