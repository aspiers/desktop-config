screens:
  -
    <INCLUDE screens/BenQ>
    right: Dell
  -
    <INCLUDE screens/Dell>
    left: BenQ

windows:
  <INCLUDE common/monitoring-full-width>

  <INCLUDE common/editor-windows>

  <INCLUDE common/orca>


  <INCLUDE common/chrome-apps>

  <INCLUDE common/terminal-windows>

  <INCLUDE common/fixed-windows>

  <INCLUDE common/top-term-windows-primary>

  <INCLUDE common/toucan>

  <INCLUDE common/side-projects>

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(personal|Panther))
    screen: primary
    workspace: 5
    map: no

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(secondary|gather.town))
    screen: secondary
    sticky: yes

  <INCLUDE common/browser-multi>

  <INCLUDE common/firefox>

  <INCLUDE common/notion>

  <INCLUDE common/gitk>

  <INCLUDE common/communication>

  <INCLUDE common/kraken>

  <INCLUDE common/lm-studio>

  - match: (Class=pavucontrol)
    screen: primary
    position: 2% 2%
    size: 40% 35%
    sticky: no
  # Relayout only: a new window opens on the current workspace.
  - match: (Class=pavucontrol)
    workspace: 6
    map: no

  - match: (Class=Blueman-manager)
    screen: primary
    position: 2% 5% BottomLeft
    size: 35% 38%
    sticky: no
  # Relayout only: a new window opens on the current workspace.
  - match: (Class=Blueman-manager)
    workspace: 6
    map: no

  <INCLUDE common/chrysalis-single>
