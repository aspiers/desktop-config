dpi: 84

# Mirror image of celtic+BenQ: the BenQ sits on the left.  Screens pair
# with outputs left to right, so the order below must match the physical
# arrangement saved in the celtic+BenQ-BL3200 autorandr profile.
screens:
  -
    <INCLUDE screens/BenQ>
    right: celtic
  -
    # fluxbox treats primary as head 1, and the BenQ is primary.
    head: 2
    <INCLUDE screens/celtic-auxiliary>
    assignment: secondary
    left: BenQ

windows:

  <INCLUDE common/monitoring-full-width>

