dpi: 96
ui_scale: 0.9

screens:
  -
    <INCLUDE screens/celtic-auxiliary>
    # fluxbox treats primary as head 1, and we are setting the BenQ as
    # the primary head (see bin/get-layout).  It also used to set the
    # laptop as head 3 for some reason, even though it's on the far
    # left - however now we see these swapped?!  Hopefully this is a
    # semi-stable numbering since there's no obvious way to auto-detect.
    head: 2
    assignment: celtic
    right: BenQ
  -
    <INCLUDE screens/BenQ>
    scale: 1.5
    left: celtic
    right: Dell
  -
    <INCLUDE screens/Dell>
    head: 3
    assignment: secondary
    left: BenQ

windows:

  <INCLUDE common/gkrellm>

  <INCLUDE common/terminal-windows>

  <INCLUDE common/top-term-windows-secondary>

  <INCLUDE common/editor-windows>

  <INCLUDE common/orca>


  <INCLUDE common/chrome-apps>

  <INCLUDE common/toucan>

  <INCLUDE common/side-projects>

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(personal$|Panther))
    screen: primary
    workspace: 5

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(secondary))
    screen: secondary
    sticky: yes

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(gather\.town|.* \| Gather.*))
    screen: celtic
    position: <s_celtic_single_left> <s_celtic_single_top>
    size: <s_celtic_single_width> <s_celtic_single_height>
    sticky: yes

  - match: (Name=brave-browser|google-chrome|chromium) (Head=<s_primary_head>)
    position: <s_primary_single_left> <s_primary_single_top>
    size: <s_primary_single_width> <s_primary_single_height>

  - match: (Name=brave-browser|google-chrome|chromium) (Head=<s_secondary_head>)
    position: <s_secondary_single_left> <s_secondary_single_top>
    size: <s_secondary_single_width> <s_secondary_single_height>

  - match: (Name=brave-browser|google-chrome|chromium) (Head=<s_primary_head>)
    sticky: no

  - match: (Name=brave-browser|google-chrome|chromium) (Head=<s_celtic_head>|<s_secondary_head>)
    sticky: yes

  <INCLUDE common/firefox>

  <INCLUDE common/notion>

  <INCLUDE common/gitk>

  <INCLUDE common/communication>

  <INCLUDE common/kraken>

  <INCLUDE common/lm-studio>

  - match: (Class=pavucontrol)
    screen: celtic
    position: 2% 2%
    size: 40% 35%
    sticky: yes

  - match: (Class=Blueman-manager)
    screen: celtic
    position: 2% 22% BottomLeft
    size: 35% 40%
    sticky: yes

  - match: (Class=Chrysalis)
    screen: celtic
    position: 5% 5%
    size: 90% 90%
    sticky: yes
