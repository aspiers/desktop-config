# Chrome app (PWA) windows carry the app id in WM_CLASS name rather than
# google-chrome, so the browser rules never match them.
# abmm... is Octobox; ljll... is Bead Me Up, Scotty.
- match: (Name=crx_(abmmfmbebheickoidomeknhdimhaeand|ljlljnognehhlkgfnimnmobbidakmlld))
  screen: primary
  position: <s_primary_full_left> <s_primary_full_top>
  size: <s_primary_full_width> <s_primary_full_height>
  sticky: no
