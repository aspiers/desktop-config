# lnav-system is split out of the shared monitoring-tools rule below and left
# alone, so that fluxbox-focus-or-launch --toggle owns its workspace
# placement.  See top-term-windows-primary.yaml for the full rationale.
- match: (Name=top-term) (Title=lnav-system)
  screen: secondary
  position: 0 0 Center
  size: 90% 90%

- match: (Name=top-term) (Title=btop|htop|sudo (powertop|nethogs|iotop|iftop)|nvtop|amdgpu_top)
  screen: secondary
  position: 0 0 Center
  size: 90% 90%
