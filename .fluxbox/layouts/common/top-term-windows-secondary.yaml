# ResizeTo must precede an anchored MoveTo; see top-term-windows-primary.yaml.
#
# lnav-system is split out of the shared monitoring-tools rule below and left
# non-sticky, so that fluxbox-focus-or-launch --toggle owns its workspace
# placement.  See top-term-windows-primary.yaml for the full rationale.
- - (Name=kitty) (Title=lnav-system)
  - MacroCmd {<s_secondary_SetHead>} {ResizeTo 90% 90%} {MoveTo 0 0 Center}
  - Sticky {no}
  - Iconhidden {no}

- - (Name=kitty) (Title=btop|htop|sudo (powertop|nethogs|iotop|iftop)|nvtop|amdgpu_top)
  - MacroCmd {<s_secondary_SetHead>} {ResizeTo 90% 90%} {MoveTo 0 0 Center}
  - Sticky {yes}
  - Iconhidden {no}
