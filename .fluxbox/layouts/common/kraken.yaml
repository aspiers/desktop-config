# Kraken Desktop sets no WM_CLASS at all (both fields are empty), so it
# can only be matched on its title; Class=^$ keeps that loose title match
# from catching browser windows etc. which happen to mention Kraken.
- match: (Class=^$) (Title=Kraken)
  screen: primary
  workspace: 6
  position: <s_primary_col1_left> <s_primary_row1_top>
  size: <s_primary_active_width> <s_primary_active_height>
  sticky: no
