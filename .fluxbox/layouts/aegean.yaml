screens:
  -
    name: laptop
    head: 1
    # gkrellm_width: &GKRELLM_WIDTH 146
    gkrellm_width: &GKRELLM_WIDTH 0
    panel_height: 35
    logs_height_pc: 0
    right_margin: *GKRELLM_WIDTH
    col1_width_pc_of_active: 55

windows:
  <INCLUDE common/monitoring-active-width>

  <INCLUDE common/terminal-windows>

  <INCLUDE common/fixed-windows>

  <INCLUDE common/top-term-windows-primary>

  <INCLUDE common/editor-windows>

  <INCLUDE common/orca>


  <INCLUDE common/chrome-apps>

  <INCLUDE common/toucan>

  <INCLUDE common/side-projects>

  - match: (Name=brave-browser|google-chrome|chromium) (Title=.*(personal$|secondary|Panther))
    screen: primary
    workspace: 5
    map: no

  - match: (Name=brave-browser|google-chrome|chromium)
    screen: primary
    position: <s_primary_single_left> <s_primary_single_top>
    size: <s_primary_single_width> <s_primary_single_height>
    sticky: no

  <INCLUDE common/firefox>

  <INCLUDE common/notion>

  <INCLUDE common/gitk>

  <INCLUDE common/communication>

  <INCLUDE common/kraken>

  <INCLUDE common/lm-studio>

  - match: (Class=pavucontrol)
    screen: primary
    position: 42% 1%
    size: 32% 35%
    sticky: no
  # Relayout only: a new window opens on the current workspace.
  - match: (Class=pavucontrol)
    workspace: 6
    map: no

  - match: (Class=Blueman-manager)
    screen: primary
    position: 0% 0%
    size: 20% 52%
    sticky: no
  # Relayout only: a new window opens on the current workspace.
  - match: (Class=Blueman-manager)
    workspace: 6
    map: no

  <INCLUDE common/chrysalis-single>
